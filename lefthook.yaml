extends:
  - lefthook-base.yaml

# Python-specific hooks. Base hooks (shell/markdownlint/yaml/taplo/gitleaks/
# trivy) come from lefthook-base.yaml via extends.
#
# mypy is intentionally NOT in pre-commit; it's CI-only because of its slow
# warm time (~5-10s on the OpsHub codebase). Local pre-commit uses pyright
# which is ~10x faster (ADR-0001 Negative §2).
pre-commit:
  parallel: true
  commands:
    ruff-check:
      glob: "**/*.py"
      run: mise exec -- uv run ruff check --fix {staged_files}
      stage_fixed: true
    ruff-format:
      glob: "**/*.py"
      run: mise exec -- uv run ruff format {staged_files}
      stage_fixed: true
    pyright:
      glob: "**/*.py"
      run: mise exec -- uv run pyright {staged_files}
    # Phase 16-D (ADR-0029 §dogfood) — guard against drift between the
    # assistant skill SSOT (``docs/skills/<name>/``) and the in-repo
    # dogfood mirrors (``.claude/skills/<name>/`` for Claude Code,
    # ``.agents/skills/<name>/`` for Codex CLI / Copilot CLI). The
    # assistant skill names listed in
    # :data:`opshub._skills_resources.ASSISTANT_SKILL_NAMES` are the
    # only ones the install path touches; ecosystem-common skill names
    # (drive / lint / commit / ...) are disjoint and intentionally not
    # compared here (ADR-0029 §決定 (h) carve-out).
    #
    # We compare files directly with ``diff -rq`` rather than going via
    # ``opshub skills install`` / ``opshub skills list`` purely to keep
    # the pre-commit hook fast (no uv invocation round-trip). The install
    # CLI itself resolves correctly in editable checkouts —
    # ``opshub._skills_resources._checkout_docs_skills`` short-circuits
    # to ``docs/skills/`` when an opshub working tree is detected, so a
    # stale ``src/opshub/_skills/`` build mirror does not leak into
    # mirror regeneration. The direct diff stays as the speed
    # optimisation, not a correctness workaround.
    #
    # The glob covers all three roots so the hook only fires when the
    # commit actually touches skill content — unrelated commits skip
    # this command entirely and keep pre-commit fast.
    skills-sync-check:
      glob:
        - "docs/skills/**"
        - ".claude/skills/**"
        - ".agents/skills/**"
      run: |
        assistant_skills='personal-brief next-actions pr-review find-document meeting-prep research external-brief decision-rationale handoff-draft announcement-draft reply-draft inbox-triage source-extract meeting-followup catchup'
        drift=0
        for name in $assistant_skills; do
          for mirror in .claude/skills .agents/skills; do
            if ! diff -rq "docs/skills/$name" "$mirror/$name" >/dev/null 2>&1; then
              echo "  drift: $mirror/$name vs docs/skills/$name"
              drift=1
            fi
          done
        done
        if [ $drift -ne 0 ]; then
          echo 'lefthook[skills-sync-check] drift detected between docs/skills/ (SSOT) and .claude/skills/ + .agents/skills/ mirrors.'
          echo 'Run `uv run opshub skills install --scope project` and stage the result before committing (Phase 16-D, ADR-0029).'
          exit 1
        fi
