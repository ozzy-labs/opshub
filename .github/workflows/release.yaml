# Tag-triggered release build + (future) PyPI publish.
#
# This workflow runs on every SemVer tag (``v*.*.*``) and:
#
#   1. Validates that ``__version__`` matches the tag (fails fast on typo)
#   2. Builds the sdist + wheel via ``uv build``
#   3. Uploads the artifacts to the workflow run (90-day retention) for
#      inspection or optional manual attachment to a GitHub Release
#
# In the v0.1.x line, **PyPI publishing is deferred** — see
# `docs/RELEASE_RUNBOOK.md §Future: PyPI migration` and ADR-0001 §Updates
# for the rationale. The primary distribution path is git source:
#
#     uv tool install git+https://github.com/ozzy-labs/opshub.git@v0.1.0
#
# The ``publish`` job below is preserved as commented-out scaffolding so the
# migration to PyPI is a small, mostly-mechanical change:
#
#   1. Register a Trusted Publisher on PyPI (Owner ``ozzy-labs`` /
#      Repository ``opshub`` / Workflow ``release.yaml`` / Environment ``pypi``)
#   2. Create the ``pypi`` GitHub Environment in repo Settings → Environments
#   3. Uncomment the ``publish`` job below
#   4. Update README + CHANGELOG to advertise ``uv tool install opshub``
#
# Trusted Publishers (OIDC) replace static ``PYPI_TOKEN`` / ``TWINE_PASSWORD`` —
# no long-lived registry tokens live in this repository. This matches the
# project's npm Trusted Publishers stance (CLAUDE.md). See
# https://docs.pypi.org/trusted-publishers/ for the full PyPI-side flow.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Default to read-only for the workflow; the publish job re-grants
# ``id-token: write`` at job scope (least privilege per the OIDC docs).
permissions:
  contents: read

concurrency:
  # Releases are tag-scoped; serialize per-tag to keep PyPI uploads
  # idempotent if a tag is force-pushed (rare but possible).
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so changelog / version-derivation tools can
          # walk back to the previous tag if needed.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # Pin to the version in .mise.toml so local dev and CI share
          # the exact uv used to resolve uv.lock (mirrors ci.yaml).
          version: "0.11.10"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install project (locked)
        # ``--no-dev`` keeps the build env minimal; we only need the
        # core package importable so the version-vs-tag check can read
        # ``opshub.__version__``.
        run: uv sync --locked --no-dev

      - name: Verify tag matches package version
        # Fail fast: a typo in the tag (e.g. ``v0.1.0`` vs package
        # ``0.1.1``) must not produce a published artifact whose
        # filename disagrees with the tag.
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(uv run python -c 'from opshub import __version__; print(__version__)')"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag v${tag_version} does not match package version ${pkg_version}"
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches package version ${pkg_version}."

      - name: Build sdist + wheel
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          # Longer retention than ci.yaml (7 days) because release
          # artifacts may be referenced for several months after a tag,
          # e.g. for manual GitHub-Release attachment or post-mortem
          # build reproduction. 90 is GitHub's default cap for
          # public-repo artifacts.
          retention-days: 90

  # TODO(pypi): re-enable when migrating from git-source distribution to PyPI.
  # The job below is intentionally commented out for the v0.1.x line so
  # tagged releases produce verified artifacts without publishing to PyPI.
  # See docs/RELEASE_RUNBOOK.md §Future: PyPI migration for the click-path
  # to re-enable. The shape below is correct as of 2026-05-18; review the
  # PyPI Trusted Publishers docs at https://docs.pypi.org/trusted-publishers/
  # before un-commenting in case the action API has moved on.
  #
  # publish:
  #   name: Publish to PyPI
  #   needs: build
  #   runs-on: ubuntu-24.04
  #   environment:
  #     name: pypi
  #     url: https://pypi.org/project/opshub/
  #   permissions:
  #     # OIDC token issuance for PyPI Trusted Publishers. Without this
  #     # the ``pypa/gh-action-pypi-publish`` step has no way to
  #     # authenticate -- there is intentionally no fallback token here.
  #     id-token: write
  #   steps:
  #     - name: Download build artifacts
  #       uses: actions/download-artifact@v4
  #       with:
  #         name: dist
  #         path: dist/
  #
  #     - name: Publish to PyPI
  #       # OIDC auth is implicit when ``id-token: write`` is set and the
  #       # job's environment name matches the PyPI Trusted Publisher
  #       # configuration. No ``password:`` / ``user:`` inputs --
  #       # supplying them would silently fall back to legacy token auth.
  #       uses: pypa/gh-action-pypi-publish@release/v1
