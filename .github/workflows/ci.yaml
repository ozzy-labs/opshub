name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Lint, type check, test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Pin to the version in .mise.toml so local dev and CI share the
          # exact uv used to resolve uv.lock.
          version: "0.11.10"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies (locked)
        # ``connectors-github`` is included so type-checkers and pytest
        # can resolve ``httpx`` (required by
        # ``opshub.connectors.github.api`` — Phase 3 step B2). The
        # cold-start guard (``tests/integration/test_cli_imports.py``)
        # still asserts that connector code never reaches the
        # ``opshub --help`` path.
        #
        # ``vector`` is included so Phase 4 migration 0013 (CREATE
        # VIRTUAL TABLE ... USING vec0) can run inside the migration
        # integration tests — sqlite-vec must be importable at runtime
        # for ``opshub.db.engine``'s connect listener to load the
        # extension before the migration issues the DDL.
        #
        # ``llm-anthropic`` is included so Phase 5 step A3 unit tests
        # (``tests/unit/llm/test_anthropic_client.py``) can
        # ``importorskip`` the ``anthropic`` SDK and run mocked
        # round-trips. No real API call leaves CI — every SDK touchpoint
        # is patched (ADR-0015 §決定 + the Phase 4 OpenAI embedder
        # precedent).
        #
        # ``llm-openai`` is included so Phase 5 step A4 unit tests
        # (``tests/unit/llm/test_openai_client.py``) can import the
        # ``openai`` SDK; every chat-completion call is patched at the
        # ``openai.OpenAI`` boundary so no real request leaves CI.
        #
        # ``llm-ollama`` is included so Phase 6 step A4 unit tests
        # (``tests/unit/llm/test_ollama_client.py``) can ``importorskip``
        # ``httpx`` and exercise the Ollama OpenAI-compatible client.
        # Every request is routed through ``httpx.MockTransport`` so no
        # real daemon call leaves CI (ADR-0016 §決定 (h) + the Phase 3
        # GitHub connector mocking precedent).
        #
        # ``connectors-slack`` is included so Phase 7 step A1 unit tests
        # (``tests/unit/connectors/slack/test_auth.py``) can
        # ``importorskip`` the ``slack_sdk`` SDK and exercise mocked
        # ``auth.test`` round-trips. Every Slack API call is patched at
        # the ``slack_sdk.WebClient`` boundary so no real request leaves
        # CI (Phase 7 plan §1 #6).
        #
        # ``connectors-ms365`` is included so Phase 7 step B1 unit tests
        # (``tests/unit/connectors/ms365/test_auth.py``) can
        # ``importorskip`` the ``msal`` SDK and exercise the OAuth
        # paste-code flow. Every MSAL touchpoint is patched at the
        # ``msal.PublicClientApplication`` class so no real Microsoft
        # endpoint is reached during CI.
        #
        # ``connectors-box`` is included so Phase 7 step C1 unit tests
        # (``tests/unit/connectors/box/test_auth.py``) can
        # ``importorskip`` the ``boxsdk`` SDK and exercise the OAuth
        # paste-code flow. Every OAuth call is patched at the
        # ``boxsdk.auth.oauth2.OAuth2`` boundary so no real Box API
        # request leaves CI (Phase 7 plan §1 #6). The cold-start guard
        # still asserts ``boxsdk`` never leaks onto the ``opshub --help``
        # path.
        run: uv sync --locked --extra dev --extra connectors-github --extra connectors-slack --extra connectors-ms365 --extra connectors-box --extra vector --extra llm-anthropic --extra llm-openai --extra llm-ollama

      - name: Ruff (lint)
        run: uv run ruff check

      - name: Ruff (format check)
        run: uv run ruff format --check

      - name: Pyright
        run: uv run pyright

      - name: Mypy (strict)
        run: uv run mypy src tests

      - name: Pytest
        run: uv run pytest
