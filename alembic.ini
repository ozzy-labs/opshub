# Alembic configuration for OpsHub.
#
# The actual SQLAlchemy URL is resolved in src/opshub/db/migrations/env.py
# (XDG-based default, or `-x url=sqlite:///...` override). The placeholder
# below exists because Alembic refuses to start without a sqlalchemy.url key.

[alembic]
# Migration scripts live inside the package so they ship in the wheel and
# survive ``uv tool install``. The %(here)s token resolves to the directory
# of this file (repo root).
script_location = %(here)s/src/opshub/db/migrations

# Default file template; ``opshub init`` and step 7 use ``alembic revision``
# which obeys this naming. We override Alembic's default to put the rev id
# *after* the slug for readability in version-sorted directory listings.
# file_template = %%(rev)s_%%(slug)s  # (Alembic default; kept for reference)

# Prepend the repo root to sys.path so that ``from opshub.db...`` imports
# work when alembic is invoked from the repo root via uv.
prepend_sys_path = .

path_separator = os

# Placeholder URL; the real URL is constructed inside env.py.
sqlalchemy.url = driver://user:pass@localhost/dbname

# ---- logging -------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
