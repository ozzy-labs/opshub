[tools]
# Runtime
python = "3.13"
uv = "0.11.10"
# Node is retained for npm-distributed dev tools below (markdownlint-cli2,
# bats, @commitlint/*). The project itself is Python (ADR-0001).
node = "24"

# Linters & formatters (cross-language, OS-level).
# Python linters (ruff, mypy, pyright) are project deps under
# `[project.optional-dependencies] dev` in pyproject.toml.
shellcheck = "0.11"
shfmt = "3"
taplo = "0.10"
"npm:markdownlint-cli2" = "0.21"
"pipx:yamllint" = "1"
yamlfmt = "0.21"
actionlint = "1"
gitleaks = "8"
trivy = "0.69"
"pipx:mdformat" = "0.7"

# Testing
"npm:bats" = "1"

# CLI utilities for AI-assisted development
ast-grep = "0.42"
yq = "4"
just = "1"
zoxide = "0.9"

# Git hooks & commit conventions
lefthook = "2"
"npm:@commitlint/cli" = "20"
"npm:@commitlint/config-conventional" = "20"
