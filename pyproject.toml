[project]
name = "opshub"
version = "0.0.0"
description = "Local-first operational memory and execution hub for humans and AI agents"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ozzy-labs" }]
requires-python = ">=3.13"
keywords = ["operational-memory", "event-sourcing", "ai-agents", "local-first"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

# Core dependencies are intentionally ML-free (ADR-0001).
# All ML / connector deps live under [project.optional-dependencies].
dependencies = [
  "typer>=0.12",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "jinja2>=3.1",
  "structlog>=24.1",
]

[project.optional-dependencies]
# Vector storage backend (Phase 4, ADR-0012).
vector = ["sqlite-vec>=0.1", "numpy>=2.0"]
# Local embedding backend (Phase 4, ADR-0012). Pulls torch (~500MB-2GB).
local-embedding = ["sentence-transformers>=3.0"]
# API embedding backends (Phase 4, ADR-0012).
api-embedding-openai = ["openai>=1.40"]
api-embedding-voyage = ["voyageai>=0.2"]
# Connectors (Phase 3).
connectors-github = ["httpx>=0.27", "PyGithub>=2.3"]
connectors-slack = ["slack-sdk>=3.30"]
connectors-msgraph = ["msgraph-sdk>=1.0"]
connectors-box = ["boxsdk>=3.10"]
# Development tools.
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "pytest-xdist>=3.6",
  "ruff>=0.6",
  "mypy>=1.11",
  "pyright>=1.1.380",
]
# Convenience: install everything a Phase 4 user typically wants.
all = [
  "opshub[vector,local-embedding,api-embedding-openai,connectors-github,connectors-slack]",
]

[project.scripts]
opshub = "opshub.cli.app:main"

[project.urls]
Homepage = "https://github.com/ozzy-labs/opshub"
Issues = "https://github.com/ozzy-labs/opshub/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# ``packages = ["src/opshub"]`` already ships every non-``.py`` file under the
# tree, including the Jinja2 templates under ``opshub/markdown/templates``.
# We explicitly list ``artifacts`` so a future packaging refactor (e.g.
# switching to ``include``/``exclude`` rules) cannot silently drop the
# templates and break ``opshub workspace generate`` after install.
packages = ["src/opshub"]
artifacts = ["src/opshub/markdown/templates/*.j2"]

[tool.uv]
package = true

# ---- ruff ----------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = [".venv", "dist", "build"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "N",   # pep8-naming
  "RUF", # ruff-specific
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---- mypy ----------------------------------------------------------------

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
files = ["src/opshub", "tests"]

# ---- pyright -------------------------------------------------------------

[tool.pyright]
include = ["src/opshub", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = "warning"

# ---- pytest --------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--strict-markers", "--strict-config", "-ra"]
