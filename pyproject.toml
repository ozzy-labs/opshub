[project]
# PyPI distribution name. PEP 423 ``<owner>-<package>`` form because PyPI
# does not support npm-style ``@scope`` namespacing — the bare ``opshub``
# name was rejected by PyPI's Pending-Publisher pre-registration (likely a
# typosquat-prevention reservation), so v0.1.0 ships under the
# owner-prefixed form.
#
# Note: this is the *distribution* name only. The Python import name
# stays ``opshub`` (see ``src/opshub/``), and the CLI command stays
# ``opshub`` (see ``[project.scripts]`` below). Users install with
# ``uv tool install ozzylabs-opshub`` and run ``opshub --version`` —
# same pattern as ripgrep on PyPI (dist ``ripgrep`` / binary ``rg``).
name = "ozzylabs-opshub"
version = "0.2.0"
description = "Local-first operational memory and execution hub for humans and AI agents"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ozzy-labs" }]
requires-python = ">=3.13"
keywords = ["operational-memory", "event-sourcing", "ai-agents", "local-first"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

# Core dependencies are intentionally ML-free (ADR-0001).
# All heavy ML / connector / LLM SDKs live under [project.optional-dependencies].
#
# ``sqlite-vec`` is a base dependency (not gated by extras) because Phase 4
# migration 0013 unconditionally creates ``embeddings_vec_*`` virtual tables —
# ``opshub init`` would fail with ``no such module: vec0`` on a default install
# without it. The extension binary is ~500 KB, well within the ADR-0001
# distribution budget which targets heavy ML SDKs (~100 MB+). See ADR-0001
# §"Updates (Phase 8.x — sqlite-vec promotion)" for the rationale.
#
# ``numpy`` stays in the ``[vector]`` extras since it's only required when
# building embeddings (callers of :class:`opshub.vectors.local_embedder.LocalSentenceTransformerEmbedder`,
# which itself sits under ``[local-embedding]``).
dependencies = [
  "typer>=0.12",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "jinja2>=3.1",
  "structlog>=24.1",
  "sqlite-vec>=0.1",
]

[project.optional-dependencies]
# Vector storage backend numerics (Phase 4, ADR-0012). ``sqlite-vec`` itself
# moved to base dependencies (Phase 8.x follow-up); this extras now only
# carries ``numpy`` for callers that need vector arithmetic outside the
# embedder path. Retained as an empty-ish alias so existing
# ``uv sync --extra vector`` invocations continue to work.
vector = ["numpy>=2.0"]
# Local embedding backend (Phase 4, ADR-0012). Pulls torch (~500MB-2GB).
local-embedding = ["sentence-transformers>=3.0"]
# API embedding backends (Phase 4, ADR-0012).
api-embedding-openai = ["openai>=1.40"]
api-embedding-voyage = ["voyageai>=0.2"]
# LLM backends (Phase 5, ADR-0015). Kept in extras per ADR-0001 + ADR-0015
# §決定 (b) so the core install stays ML / SDK free; opt in via
# ``uv sync --extra llm-anthropic`` (or ``--extra llm-openai``).
#
# ``llm-openai`` and ``api-embedding-openai`` both pull the ``openai``
# SDK but stay independent: opting into OpenAI embedding should not
# implicitly enable OpenAI chat (and vice versa). uv resolves
# overlapping extras additively.
llm-anthropic = ["anthropic>=0.40"]
llm-openai = ["openai>=1.50"]
# Local LLM backend (Phase 6, ADR-0016 §決定 (h)). Ollama daemon's
# OpenAI-compatible endpoint is consumed via ``httpx``. ``httpx`` is also
# pulled by ``connectors-github``; we re-pin it here so opting into
# ``llm-ollama`` alone (without GitHub) still resolves the dependency.
llm-ollama = ["httpx>=0.27"]
# Connectors (Phase 3).
connectors-github = ["httpx>=0.27", "PyGithub>=2.3"]
connectors-slack = ["slack-sdk>=3.30"]
connectors-msgraph = ["msgraph-sdk>=1.0"]
# Microsoft 365 connector (Phase 7 step B1, ADR-0010 + ADR-0014). ``msal``
# drives the OAuth 2.0 authorization-code (paste-code) flow and refresh
# token handling; ``httpx`` is reserved for the Microsoft Graph API
# fetcher landing in step B2. Both stay in extras so the core install
# remains SDK-free (ADR-0001) — opt in via
# ``uv sync --extra connectors-ms365``.
connectors-ms365 = ["msal>=1.30", "httpx>=0.27"]
# Box connector (Phase 7 step C1, ADR-0010 + ADR-0014). The ``<4`` upper
# bound pins to the SDK that exposes ``boxsdk.OAuth2`` — the more recent
# 10.x line on PyPI ships under the same distribution name but exports a
# different module (``box_sdk_gen``) incompatible with the paste-code
# flow this connector relies on.
connectors-box = ["boxsdk>=3.10,<4"]
# SaaS token storage (Phase 3, ADR-0014). OS keychain backed (macOS Keychain /
# Linux Secret Service / Windows Credential Locker). Connectors fetch their
# PAT / OAuth tokens through ``opshub.core.secrets``.
secrets = ["keyring>=24"]
# Development tools.
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "pytest-xdist>=3.6",
  "ruff>=0.6",
  "mypy>=1.11",
  "pyright>=1.1.380",
]
# Convenience: install everything a Phase 4 user typically wants.
# The self-reference must use the *distribution* name (``ozzylabs-opshub``),
# not the Python import name (``opshub``) — uv resolves this against PyPI.
all = [
  "ozzylabs-opshub[vector,local-embedding,api-embedding-openai,connectors-github,connectors-slack,secrets]",
]

[project.scripts]
opshub = "opshub.cli.app:main"

[project.urls]
Homepage = "https://github.com/ozzy-labs/opshub"
Issues = "https://github.com/ozzy-labs/opshub/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# ``packages = ["src/opshub"]`` already ships every non-``.py`` file under the
# tree, including the Jinja2 templates under ``opshub/markdown/templates``.
# We explicitly list ``artifacts`` so a future packaging refactor (e.g.
# switching to ``include``/``exclude`` rules) cannot silently drop the
# templates and break ``opshub workspace generate`` after install.
packages = ["src/opshub"]
artifacts = ["src/opshub/markdown/templates/*.j2"]

[tool.uv]
package = true

# ---- ruff ----------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = [".venv", "dist", "build"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "N",   # pep8-naming
  "RUF", # ruff-specific
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---- mypy ----------------------------------------------------------------

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
files = ["src/opshub", "tests"]

# ---- pyright -------------------------------------------------------------

[tool.pyright]
include = ["src/opshub", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = "warning"

# ---- pytest --------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--strict-markers", "--strict-config", "-ra"]
